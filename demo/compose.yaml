name: itb

services:
  db:
    image: itb-demo:latest
    pull_policy: never
    container_name: itb-db
    command: ["python", "/app/db.py"]
    environment:
      LOG_PATH: /logs/app.log
      LOG_TZ_MIN: "330"
    volumes:
      - ./run/logs:/logs
    ports:
      - "127.0.0.1:18081:8081"
    networks: [itb-net]
    restart: "no"

  web:
    image: itb-demo:latest
    pull_policy: never
    container_name: itb-web
    command: ["python", "/app/web.py"]
    depends_on: [db]
    environment:
      APP_VERSION: ${ITB_WEB_VERSION:-v1}
      APP_BUG: ${ITB_WEB_BUG:-}
      LEAK_MB_PER_S: "6"
      DB_HOST: db
      DB_PORT: "8081"
      LOG_PATH: /logs/app.log
      LOG_TZ_MIN: "330"
    volumes:
      - ./run/logs:/logs
    ports:
      - "127.0.0.1:18080:8080"
    mem_limit: 80m
    memswap_limit: 80m
    networks: [itb-net]
    restart: "no"

networks:
  itb-net:
    name: itb-net
