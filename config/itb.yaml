# Incident Timeline Builder: default config (Step 4: clock section)
clock:
  # Source whose clock we trust. Others are corrected towards it.
  reference_source: docker

  # Timezone of naive timestamps per source (used while collecting).
  # Examples: "UTC", "+05:30"
  source_tz: {}

  # Known fixed skew per source in seconds (ADDED to the source time).
  # Wins over auto estimation. Example: applog: -90
  manual_skew_s: {}

  auto:
    enabled: true
    max_offset_s: 900     # ignore anchor pairs further apart than this
    max_spread_s: 10      # anchors must agree within this, else not applied
    min_pairs: 2          # need at least this many anchor pairs
    min_apply_s: 1.0      # offsets below this are normal delay, left alone
    anchors:
      # a git deploy should be followed by a docker restart ~5s later
      - source: git
        type: deploy
        ref_source: docker
        ref_type: restart
        expected_lag_s: 5

# Step 5: incident detection (all thresholds are configurable)
detection:
  error_rate_threshold: 0.05   # probe is "bad" if error_rate >= this (or the check failed)
  latency_ms_threshold: 0      # set e.g. 500 to also treat slow probes as bad; 0 = off
  start_consecutive: 3         # bad probes in a row before an incident opens (blip filter)
  recover_consecutive: 3       # good probes in a row before it closes
  min_duration_s: 10           # closed incidents shorter than this are dropped
  merge_gap_s: 30              # incidents closer than this are merged (flapping)

# Step 6: suspect ranking (score = sum of explained components, 0-100)
ranking:
  lookback_s: 600            # only changes this close before the incident start are suspects
  top_n: 5
  weights:
    proximity: 40            # closer to the incident start = more points
    relation: 15             # same service, or named in the affected service's error logs
    corroboration: 15        # error logs / abnormal exits appeared after the change
    evidence: 10             # direct failure signal on the change (OOM, non-zero exit)
  type_weights:
    deploy: 20
    config: 15
    restart: 8
  stable_s: 60               # service healthy this long after a change = weaker suspect
  stable_penalty: 25
  burst_window_s: 5            # die/stop right after kill of the same container = one failure
  rollout_window_s: 60       # container start this soon after a deploy is its rollout, not a cause
  confidence:
    high_score: 70
    high_margin: 15
    medium_score: 50
    medium_margin: 8

# Step 7: postmortem report
report:
  max_timeline_rows: 40      # older low-priority rows are dropped above this (markers and suspects stay)
  after_window_s: 60         # show events up to this long after recovery
  top_error_messages: 3      # most frequent error lines listed under Impact
